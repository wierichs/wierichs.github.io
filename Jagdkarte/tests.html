<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jagdkarte data tests</title>
</head>
<body>
  <h1>Jagdkarte data tests</h1>
  <pre id="results">Running tests...</pre>
  <script type="module">
    import { runDataTests } from './data.test.js';
    import { initializeAppFixture, runAppTests } from './app.test.js';
    import { runOfflineMapTests } from './offline-map.test.js';

    if (new URLSearchParams(location.search).has('app-fixture')) {
      await initializeAppFixture();
    } else {
      const output = document.querySelector('#results');
      try {
        const passed = [...await runDataTests(), ...await runAppTests(), ...await runOfflineMapTests()];
        output.textContent = passed.map(test => `PASS ${test}`).join('\n');
        document.body.dataset.testResult = 'passed';
      } catch (error) {
        output.textContent = `FAIL ${error.message}`;
        document.body.dataset.testResult = 'failed';
        console.error(error);
      }
    }
  </script>
</body>
</html>
